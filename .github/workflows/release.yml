name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # contents: write lets changelogithub create the GitHub release.
      contents: write
      # id-token: write lets npm publish through trusted publishing, without a token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test

      # prepack builds the package and copies README.md and LICENSE into it.
      - run: npm publish
        working-directory: packages/botflare

      - run: npx changelogithub@15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
