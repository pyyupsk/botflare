name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # The prepare script installs git hooks, which CI does not need.
      - run: bun install --frozen-lockfile --ignore-scripts

      # The example reads the types of the built library.
      - run: bun run build
        working-directory: packages/botflare

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run deadcode
      - run: bun run test
